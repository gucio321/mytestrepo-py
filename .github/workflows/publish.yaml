name: "Publish on test.PyPi.org"
on:
  push:
    tags:
      - v*

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: mytestrepo_py_gucio321
      url: https://test.pypi.org/p/mytestrepo-py-gucio321
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      name: set up python
      with:
        python-version: '3.13'
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Update pyproject.toml
      run: |
        pip install poetry
        poetry version ${{ steps.version.outputs.version }}
    - name: Commit and push the changed version
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Sync the project version with GitHub tags"
        branch: master
    - name: Build the package
      run: |
        python -m pip install --upgrade build
        python -m build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@v1.13.0
      with:
        repository-url: https://test.pypi.org/legacy/

